apply plugin: 'com.android.application'

def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasKeystore = keystorePropsFile.exists()

android {
    namespace 'com.rent.utility'
    compileSdk 35

    defaultConfig {
        applicationId "com.rent.utility"
        minSdk 26
        targetSdk 35
        versionCode 25
        versionName "2.10.2"
    }

    // 签名信息不写进仓库：在 android-app/keystore.properties 里配置（已被 .gitignore 忽略）
    // storeFile=../app/release.keystore / storePassword=xxx / keyAlias=xxx / keyPassword=xxx
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                keystoreProps.load(new FileInputStream(keystorePropsFile))
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 没配签名就退回 debug 签名，保证任何人都能编译、安装
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
}

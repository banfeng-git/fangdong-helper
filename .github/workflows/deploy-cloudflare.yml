name: Deploy Cloudflare Workers

on:
  # 手动触发：在 Actions 页面点 Run workflow 即可（需要先在 Secrets 里配好 CLOUDFLARE_API_TOKEN 等）
  workflow_dispatch:
    inputs:
      remote:
        description: '对远程 D1 执行建表（首次部署选 true）'
        required: true
        default: 'true'
        type: boolean

jobs:
  deploy:
    name: 部署到 Cloudflare Workers + D1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 生成 Workers 单文件
        run: node backend/scripts/build.mjs

      - name: 初始化 D1 表结构
        working-directory: backend/cf-workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 d1 execute fangdong_db ${{ github.event.inputs.remote == 'true' && '--remote' || '--local' }} --file=schema.sql

      - name: 部署 Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend/cf-workers
          command: deploy
